# Mensajes de enlazado de formularios (Spring MVC / Bean Validation).
#
# Sin este archivo, un valor que no puede convertirse al tipo del campo
# (por ejemplo "abc" en el tiempo disponible) llegaba a la pantalla como
# "Failed to convert property value of type java.lang.String to required
# type java.lang.Integer...". Spring resuelve el codigo typeMismatch de mas
# especifico a mas general; con el tipo de destino basta.
typeMismatch.java.lang.Integer=Debe ser un n\u00famero entero
typeMismatch.int=Debe ser un n\u00famero entero
typeMismatch.java.lang.Short=Debe ser un n\u00famero entero
typeMismatch.java.math.BigDecimal=Debe ser un n\u00famero (usa punto para los decimales)
typeMismatch.java.time.LocalTime=La hora debe tener el formato HH:MM
typeMismatch.java.time.LocalDate=La fecha no es v\u00e1lida
typeMismatch.java.util.List=Alguno de los valores marcados no es v\u00e1lido
typeMismatch.com.turismo.model.Estacion=La estaci\u00f3n indicada no existe
typeMismatch.com.turismo.model.Preferencia=La preferencia indicada no existe
typeMismatch=El valor no es v\u00e1lido
