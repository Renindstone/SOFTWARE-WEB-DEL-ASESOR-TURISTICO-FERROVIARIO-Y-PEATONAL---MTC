<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout/base :: head('Ocurrió un problema')}"></head>

<body>
<div th:replace="~{layout/nav :: nav}"></div>

<main class="container py-5" style="max-width: 620px;">
  <div class="card section-card">
    <div class="card-body text-center p-4 p-md-5">
      <i class="bi bi-exclamation-triangle fs-1" style="color:#C89B3C;"></i>

      <h1 class="h4 fw-bold page-title mt-3 mb-2"
          th:text="${tituloError} ?: 'No se pudo completar la operación'">
        No se pudo completar la operación
      </h1>

      <!-- CN-09: aqui aparece el mensaje de aforo completo con la fecha alternativa. -->
      <p class="page-sub" th:text="${mensajeError}">Mensaje de error.</p>

      <!-- Datos que expone el ErrorController de Spring Boot para errores HTTP. -->
      <p class="small page-sub" th:if="${mensajeError == null and status != null}">
        <span th:text="${status}">500</span>
        <span th:text="${error}"></span>
      </p>

      <div class="d-flex align-items-center gap-2 justify-content-center mt-3">
        <a th:href="@{/preferencias}" class="btn btn-mtc btn-sm">Planificar una visita</a>
        <a th:href="@{/}" class="btn btn-mtc-outline btn-sm">Ir al inicio</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>

</html>
