<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--
  Auto-registro del turista. Solo crea cuentas TURISTA_PUBLICO, para que
  el visitante conserve su historial en /mis-informes (RF-10 / CU-09);
  las cuentas administrativas las sigue creando el MTC (RNF-05).

  Comparte la estetica de auth/login.html: la pantalla de acceso no usa
  layout/base, asi que los estilos se repiten aqui a proposito.
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear cuenta - MTC</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/estilos.css}" />

  <style>
    body{
      font-family:'Manrope', system-ui, sans-serif;
      background:#F6F4EF;
    }

    .login-card{
      border:none;
      border-radius:16px;
      border-top:4px solid #C89B3C;
      box-shadow:0 14px 32px -14px rgba(20,69,61,.28);
      overflow:hidden;
    }

    .brand-icon{
      width:58px; height:58px;
      background:#14453D;
      color:#C89B3C;
    }

    h1.form-title{ color:#14453D; letter-spacing:-0.01em; }

    .input-group{
      border:1.5px solid #DEDCD2;
      border-radius:9px;
      overflow:hidden;
      transition:border-color .15s ease, box-shadow .15s ease;
    }
    .input-group:focus-within{
      border-color:#14453D;
      box-shadow:0 0 0 3px rgba(20,69,61,.10);
    }
    .input-group-text{ background:#fff; border:none; color:#6B7568; }
    .form-control{ border:none; box-shadow:none !important; }

    .btn-mtc{
      background:#14453D;
      color:#fff;
      border:none;
      border-radius:9px;
      font-weight:700;
      padding-block:.65rem;
      transition:background .15s ease;
    }
    .btn-mtc:hover{ background:#0D302A; color:#fff; }

    .link-gold{ color:#A67C2E; font-weight:600; }
    .link-gold:hover{ color:#14453D; }

    .btn-ojo{ background:#fff; border:none; color:#6B7568; }
    .btn-ojo:hover{ color:#14453D; }
  </style>
</head>

<body class="bg-body-tertiary">

  <main class="container py-5" style="max-width: 560px;">
    <div class="card login-card">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <div class="mx-auto d-flex align-items-center justify-content-center rounded-3 brand-icon">
            <i class="bi bi-train-front fs-4"></i>
          </div>
          <h1 class="h4 mt-3 mb-1 fw-bold form-title">Crear cuenta de Turista</h1>
          <p class="text-muted mb-0">Planifica tus viajes y consulta tu historial de informes.</p>
        </div>

        <!-- Usuario o correo ya registrados, o contrasenas que no coinciden. -->
        <div th:if="${errorNegocio}" class="alert alert-danger py-2 mb-3 d-flex align-items-center gap-2"
          role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span th:text="${errorNegocio}">No se pudo crear la cuenta.</span>
        </div>

        <form method="post" th:action="@{/registro}" th:object="${registroDto}" novalidate>

          <!-- #fields solo resuelve dentro del elemento que declara th:object. -->
          <div class="alert alert-warning py-2 mb-3" th:if="${#fields.hasAnyErrors()}" role="alert">
            <div class="fw-semibold mb-1">
              <i class="bi bi-exclamation-triangle-fill me-1"></i> Corrija los siguientes datos:
            </div>
            <ul class="mb-0 ps-3 small">
              <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
            </ul>
          </div>

          <div class="row g-3">
            <div class="col-md-6">
              <label for="nombre" class="form-label fw-medium">Nombre</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input id="nombre" type="text" class="form-control" th:field="*{nombre}"
                  maxlength="50" placeholder="Tus nombres" autocomplete="given-name" required />
              </div>
            </div>

            <div class="col-md-6">
              <label for="apellidos" class="form-label fw-medium">Apellidos</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-vcard"></i></span>
                <input id="apellidos" type="text" class="form-control" th:field="*{apellidos}"
                  maxlength="50" placeholder="Tus apellidos" autocomplete="family-name" required />
              </div>
            </div>
          </div>

          <div class="mt-3">
            <label for="email" class="form-label fw-medium">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input id="email" type="email" class="form-control" th:field="*{email}"
                maxlength="50" placeholder="tucorreo@ejemplo.com" autocomplete="email" required />
            </div>
          </div>

          <div class="mt-3">
            <label for="nombreUsuario" class="form-label fw-medium">Nombre de usuario</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-at"></i></span>
              <input id="nombreUsuario" type="text" class="form-control" th:field="*{nombreUsuario}"
                minlength="4" maxlength="50" placeholder="Con el que iniciarás sesión"
                autocomplete="username" required />
            </div>
            <div id="ayudaUsuario" class="form-text">Entre 4 y 50 caracteres.</div>
          </div>

          <div class="row g-3 mt-0">
            <div class="col-md-6">
              <label for="contrasenia" class="form-label fw-medium">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                <input id="contrasenia" type="password" class="form-control" th:field="*{contrasenia}"
                  minlength="6" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required />
                <button class="btn btn-ojo" type="button" tabindex="-1"
                  data-objetivo="contrasenia" aria-label="Mostrar contraseña">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="col-md-6">
              <label for="confirmarContrasenia" class="form-label fw-medium">Confirmar contraseña</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                <input id="confirmarContrasenia" type="password" class="form-control"
                  th:field="*{confirmarContrasenia}" placeholder="Repite la contraseña"
                  autocomplete="new-password" required />
                <button class="btn btn-ojo" type="button" tabindex="-1"
                  data-objetivo="confirmarContrasenia" aria-label="Mostrar contraseña">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-mtc w-100 mt-4">Registrarme</button>

          <div class="text-center mt-3">
            <span class="text-muted small">¿Ya tienes una cuenta?</span>
            <a th:href="@{/login}" class="text-decoration-none fw-semibold ms-1 link-gold">
              Inicia sesión aquí
            </a>
          </div>
        </form>
      </div>
    </div>

    <div class="text-center small text-muted mt-3">
      © <span th:text="${#dates.format(#dates.createNow(),'yyyy')}">2026</span> MTC
    </div>
  </main>

  <div th:replace="~{layout/footer :: footer}"></div>

  <script>
    // Un unico manejador para los dos campos: cada boton dice en
    // data-objetivo cual de ellos destapa.
    document.querySelectorAll('.btn-ojo').forEach(function (boton) {
      boton.addEventListener('click', function () {
        var campo = document.getElementById(boton.dataset.objetivo);
        var icono = boton.querySelector('i');
        var oculta = campo.type === 'password';
        campo.type = oculta ? 'text' : 'password';
        icono.classList.toggle('bi-eye');
        icono.classList.toggle('bi-eye-slash');
        boton.setAttribute('aria-label', oculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
      });
    });
  </script>
</body>
</html>
