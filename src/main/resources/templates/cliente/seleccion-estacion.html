<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout/base :: head('Estaciones disponibles')}"></head>

<body>
<div th:replace="~{layout/nav :: nav}"></div>

<main class="container py-4" style="max-width: 780px;">

  <div class="mb-4">
    <h1 class="h4 fw-bold page-title mb-1">¿Desde qué estación viajas?</h1>
    <!-- RF-02 (CN-02): las estaciones inactivas no llegan a este listado. -->
    <p class="page-sub mb-0">Solo se muestran las estaciones activas de la red de PeruRail.</p>
  </div>

  <!-- Mismo tablero que el buscador: la altitud acompana a la ciudad porque a
       estas alturas condiciona la caminata tanto como la distancia. -->
  <div class="tablero" th:if="${not #lists.isEmpty(estaciones)}">
    <a class="tablero-fila tablero-enlace" th:each="est : ${estaciones}"
       th:href="@{/preferencias(idEstacionOrigen=${est.id})}">
      <div>
        <h2 class="tablero-nombre" th:text="${est.nombre}">Estación</h2>
        <p class="page-sub small mb-0">
          <span th:text="${est.ciudad}">Ciudad</span>
          <span th:if="${est.codigo != null}">
            &middot; <span class="cifra" th:text="${est.codigo}">COD</span>
          </span>
        </p>
      </div>

      <div class="tablero-cifras" th:if="${est.altitud != null}">
        <span class="tablero-dato">
          <span class="tablero-valor" th:text="${est.altitud}">0</span>
          <span class="tablero-unidad">m s. n. m.</span>
        </span>
      </div>
    </a>
  </div>

  <div class="card section-card" th:if="${#lists.isEmpty(estaciones)}">
    <div class="card-body text-center py-5">
      <p class="page-sub mb-1 mx-auto">Todavía no hay estaciones activas registradas.</p>
      <p class="small page-sub mb-0 mx-auto">
        La sincronización con PeruRail aún no ha traído datos.
      </p>
    </div>
  </div>

</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>

</html>
