<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
  <!--
    Navegacion compartida: barra lateral fija en escritorio y, por debajo de
    lg, una barra superior delgada con boton hamburguesa que abre la misma
    barra lateral como Offcanvas de Bootstrap (offcanvas-lg: un solo marcado
    para los dos modos; RNF-02). Referencia visual: docs/NavBar.jpg.

    Los enlaces de administracion se muestran segun el rol autenticado
    (RNF-05); la tarjeta de usuario solo aparece para usuarios autenticados,
    porque el panel del turista tambien es accesible de forma anonima y ahi
    no hay principal del que leer nombre ni authorities.

    La pildora activa se decide en el servidor con rutaActual, que expone
    NavegacionAdvice para todas las vistas (Thymeleaf 3.1 ya no da acceso a
    #httpServletRequest desde la plantilla). Cada enlace declara el prefijo
    de rutas que "posee": Turista abarca el buscador, la ficha de ruta, la
    seleccion de estacion y los informes, que son las pantallas del flujo
    del turista.

    Las vistas incluyen este fragmento antes de <main>; el desplazamiento
    del contenido en escritorio lo aplica estilos.css sobre body:has(.sidebar-mtc),
    asi que ninguna vista necesita cambios.
  -->
  <div th:fragment="nav" th:with="ruta=${rutaActual != null ? rutaActual : ''}">

    <!-- Barra superior: solo movil y tablet. -->
    <header class="topbar-mtc d-lg-none">
      <button class="topbar-mtc__hamburguesa" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMtc"
        aria-controls="sidebarMtc" aria-label="Abrir menú de navegación">
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
      <a class="topbar-mtc__marca" th:href="@{/}">
        <img th:src="@{/img/logo-mtc.png}" alt="MTC">
        <span>Asesor Turístico</span>
      </a>
    </header>

    <!-- Barra lateral (fija en escritorio, offcanvas por debajo de lg). -->
    <aside class="offcanvas-lg offcanvas-start sidebar-mtc" tabindex="-1" id="sidebarMtc" aria-labelledby="sidebarMtcTitulo">
      <div class="offcanvas-header sidebar-mtc__cierre d-lg-none">
        <span class="visually-hidden" id="sidebarMtcTitulo">Menú de navegación</span>
        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMtc"
          aria-label="Cerrar menú"></button>
      </div>

      <div class="offcanvas-body sidebar-mtc__cuerpo">

        <!-- Cabecera: logo en caja redondeada + nombre del sistema. -->
        <a class="sidebar-mtc__marca" th:href="@{/}">
          <span class="sidebar-mtc__logo">
            <img th:src="@{/img/logo-mtc.png}" alt="MTC">
          </span>
          <span class="sidebar-mtc__titulo">
            <strong>Asesor Turístico</strong>
            <small>Ferroviario y Peatonal</small>
          </span>
        </a>
        <!-- Unica aparicion del dorado institucional en la pantalla. -->
        <hr class="sello-regla sidebar-mtc__sello">

        <nav class="sidebar-mtc__menu" aria-label="Navegación principal">
          <a class="sidebar-mtc__enlace" th:href="@{/preferencias}"
            th:classappend="${#strings.startsWith(ruta, '/preferencias') or #strings.startsWith(ruta, '/rutas') or #strings.startsWith(ruta, '/informes') or #strings.startsWith(ruta, '/estaciones/seleccion')} ? 'activo'">
            <i class="bi bi-compass" aria-hidden="true"></i><span>Turista</span>
          </a>
          <!-- RNF-05: el historial de informes es del turista; los operadores
               externos mantienen su catalogo y no planifican visitas. -->
          <a class="sidebar-mtc__enlace" th:href="@{/mis-informes}"
            sec:authorize="hasAnyRole('TURISTA_PUBLICO','ADMIN_MTC')"
            th:classappend="${#strings.startsWith(ruta, '/mis-informes')} ? 'activo'">
            <i class="bi bi-file-earmark-text" aria-hidden="true"></i><span>Mis Informes</span>
          </a>
          <a class="sidebar-mtc__enlace" th:href="@{/zonas}"
            sec:authorize="hasAnyRole('ADMIN_MTC','TRAVEL_GROUP_USER')"
            th:classappend="${#strings.startsWith(ruta, '/zonas')} ? 'activo'">
            <i class="bi bi-geo-alt" aria-hidden="true"></i><span>Zonas</span>
          </a>
          <a class="sidebar-mtc__enlace" th:href="@{/estaciones}"
            sec:authorize="hasAnyRole('ADMIN_MTC','TRAVEL_GROUP_USER')"
            th:classappend="${ruta == '/estaciones'} ? 'activo'">
            <i class="bi bi-train-front" aria-hidden="true"></i><span>Estaciones</span>
          </a>
          <a class="sidebar-mtc__enlace" th:href="@{/estaciones/zonas-asignadas}"
            sec:authorize="hasAnyRole('ADMIN_MTC','TRAVEL_GROUP_USER')"
            th:classappend="${#strings.startsWith(ruta, '/estaciones/zonas-asignadas')} ? 'activo'">
            <i class="bi bi-signpost-split" aria-hidden="true"></i><span>Zonas por estación</span>
          </a>
          <a class="sidebar-mtc__enlace" th:href="@{/servicios-tren}"
            sec:authorize="hasAnyRole('ADMIN_MTC','PERURAIL_ADMIN')"
            th:classappend="${#strings.startsWith(ruta, '/servicios-tren')} ? 'activo'">
            <i class="bi bi-clock-history" aria-hidden="true"></i><span>Horarios/Tarifas</span>
          </a>
          <a class="sidebar-mtc__enlace" th:href="@{/auditoria}" sec:authorize="hasRole('ADMIN_MTC')"
            th:classappend="${#strings.startsWith(ruta, '/auditoria')} ? 'activo'">
            <i class="bi bi-shield-check" aria-hidden="true"></i><span>Auditoría</span>
          </a>
        </nav>

        <!-- Tarjeta de usuario fijada al fondo (docs/NavBar.jpg). -->
        <div class="sidebar-mtc__usuario" sec:authorize="isAuthenticated()">
          <span class="sidebar-mtc__avatar" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
          <span class="sidebar-mtc__identidad">
            <span class="sidebar-mtc__nombre" sec:authentication="name">Usuario</span>
            <!-- listJoin evita los corchetes del toString de la coleccion: ADMIN_MTC, no [ADMIN_MTC]. -->
            <span class="sidebar-mtc__rol"
              th:text="${#strings.replace(#strings.listJoin(#authentication.principal.authorities, ' · '), 'ROLE_', '')}">ROL</span>
          </span>
          <form th:action="@{/logout}" method="post" class="m-0">
            <button class="sidebar-mtc__salir" type="submit" title="Cerrar sesión" aria-label="Cerrar sesión">
              <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
            </button>
          </form>
        </div>

        <div class="sidebar-mtc__usuario" sec:authorize="!isAuthenticated()">
          <span class="sidebar-mtc__avatar" aria-hidden="true"><i class="bi bi-person"></i></span>
          <span class="sidebar-mtc__identidad">
            <span class="sidebar-mtc__nombre">Invitado</span>
            <span class="sidebar-mtc__rol">Consulta sin cuenta</span>
          </span>
        </div>
        <a class="sidebar-mtc__entrar" th:href="@{/login}" sec:authorize="!isAuthenticated()">
          <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Iniciar sesión
        </a>

      </div>
    </aside>
  </div>
</body>

</html>
