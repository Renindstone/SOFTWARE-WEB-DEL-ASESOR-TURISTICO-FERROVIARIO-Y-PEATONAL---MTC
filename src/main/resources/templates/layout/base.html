<!DOCTYPE html>
<!--
  Fragmentos compartidos de cabecera y scripts. Cada vista concreta hace:
      <head th:replace="~{layout/base :: head('Titulo')}"></head>
      ...
      <div th:replace="~{layout/nav :: nav}"></div>
      ...
      <div th:replace="~{layout/base :: scripts}"></div>
  No se usa thymeleaf-layout-dialect porque no esta en el pom.xml del proyecto.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' - MTC'">Asesor Turístico MTC</title>
  <!-- RNF-02: Bootstrap 5 responsive para smartphones y tablets. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- IBM Plex Sans para la prosa y Plex Mono para las cifras que el turista
       compara (km, minutos, soles, aforo). La condensada de senaletica
       (Big Shoulders) se autoaloja desde tokens.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <!-- Newsreader es la voz editorial de la Propuesta B (placa de anden,
       nombres de zona y titulares del turista). Sin conexion, la pila de
       --fuente-editorial cae a Georgia / Times New Roman: la pantalla se lee
       igual, solo con una serifa de sistema. -->
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <!-- tokens.css antes que estilos.css: declara las variables que este consume. -->
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
  <!-- Aviso del resultado de una operacion (alta, baja, habilitacion). El
       controlador lo envia como flash attribute, de modo que sobrevive al
       redirect del patron POST-Redirect-Get sin quedar pegado en la URL como
       parametro de consulta. El exito se anuncia con role="status" (cortes) y
       el fallo con role="alert" (interrumpe al lector de pantalla). -->
  <div th:fragment="alertas">
    <div th:if="${exito}" class="alert alert-success py-2 mb-3 d-flex align-items-center gap-2" role="status">
      <i class="bi bi-check-circle-fill"></i>
      <span th:text="${exito}">Operación realizada.</span>
    </div>
    <div th:if="${error}" class="alert alert-danger py-2 mb-3 d-flex align-items-center gap-2" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span th:text="${error}">Ocurrió un problema.</span>
    </div>
  </div>

  <div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </div>

  <div th:fragment="scripts-mapa">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:src="@{/js/mapa-leaflet.js}"></script>
  </div>

  <!-- Mapa del buscador de zonas. Es un fragmento aparte del de la ruta
       porque mapa-leaflet.js dibuja un unico circuito origen-destino,
       mientras que aqui se sitúan todas las zonas del resultado. -->
  <div th:fragment="scripts-buscador">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:src="@{/js/mapa-buscador.js}"></script>
  </div>
</body>

</html>
