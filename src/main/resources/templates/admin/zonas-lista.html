<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!-- RF-10 (CU-04): listado y mantenimiento de zonas turísticas de Travel Group Perú. -->
<head th:replace="~{layout/base :: head('Zonas turísticas')}"></head>

<body>
<div th:replace="~{layout/nav :: nav}"></div>

<main class="container py-4" style="max-width: 1100px;">

  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
    <div>
      <h1 class="h4 fw-bold page-title mb-1">Zonas turísticas</h1>
      <p class="page-sub mb-0">Administra las zonas disponibles para los turistas.</p>
    </div>
    <a th:href="@{/zonas/nueva}" class="btn btn-mtc">
      <i class="bi bi-plus-lg me-2"></i>Nueva zona
    </a>
  </div>

  <div class="card section-card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-mtc table-sm mb-0">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Estación cercana</th>
              <th>Preferencias</th>
              <th>Costo aprox.</th>
              <th>Cupo máx. diario</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="z : ${zonas}">
              <td>
                <span class="zona-name">
                  <i class="bi bi-signpost-split"></i>
                  <span th:text="${z.nombre}">Zona</span>
                </span>
              </td>
              <td th:text="${z.estacionCercana.nombre}">Estación</td>
              <td>
                <span class="preferencia-pill me-1" th:each="rel : ${z.preferencias}"
                      th:text="${rel.preferencia.nombre}">Preferencia</span>
              </td>
              <td>
                <span class="cost-pill" th:if="${z.costoAprox != null}"
                      th:text="'S/ ' + ${z.costoAprox}">S/ 0</span>
                <span class="page-sub small" th:if="${z.costoAprox == null}">—</span>
              </td>
              <td>
                <span th:if="${z.cupoMaximoDiario != null}" th:text="${z.cupoMaximoDiario}">0</span>
                <span class="page-sub small" th:if="${z.cupoMaximoDiario == null}">Sin control</span>
              </td>
              <td>
                <span class="badge"
                      th:classappend="${z.estado == 'Activa'} ? 'badge-activa' : 'badge-inactiva'"
                      th:text="${z.estado}">Activa</span>
              </td>
              <td class="text-end text-nowrap">
                <a class="btn btn-sm btn-mtc-outline" th:href="@{'/zonas/' + ${z.id} + '/editar'}"
                   title="Editar zona">
                  <i class="bi bi-pencil"></i>
                </a>
                <!-- RF-10: baja lógica (ZonEstado = Inactiva), auditada. -->
                <form method="post" th:action="@{'/zonas/' + ${z.id} + '/eliminar'}" class="d-inline"
                      th:if="${z.estado == 'Activa'}"
                      onsubmit="return confirm('¿Dar de baja esta zona turística?');">
                  <button type="submit" class="btn btn-sm btn-outline-danger" title="Dar de baja">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(zonas)}">
              <td colspan="7" class="text-center page-sub py-4">
                Aún no hay zonas turísticas registradas.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>

</html>
