<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--
  RF-12: mantenimiento de horarios y tarifas de los servicios de tren.
  Accesible para PERURAIL_ADMIN y ADMIN_MTC (RNF-05). Cada alta o cambio se
  registra en AuditoriaLog y la tarifa pasa por validarTarifaPeruRail (CB-05/CB-06).
-->

<head th:replace="~{layout/base :: head('Horarios y tarifas')}"></head>

<body>
  <div th:replace="~{layout/nav :: nav}"></div>

  <main class="container py-4" style="max-width: 1100px;">

    <div class="mb-4">
      <h1 class="h4 fw-bold page-title mb-1">Horarios y tarifas</h1>
      <p class="page-sub mb-0">Mantenimiento de servicios de tren entre estaciones.</p>
    </div>

    <div class="card section-card mb-4">
      <div class="card-body p-4">
        <h2 class="h6 section-title mb-3">
          <i class="bi bi-plus-circle"></i>
          <span th:text="${servicioTren.id == null} ? 'Nuevo servicio' : 'Editar servicio'">Nuevo servicio</span>
        </h2>

        <form method="post" th:action="@{/servicios-tren}" th:object="${servicioTren}" class="row g-3">
          <input type="hidden" th:field="*{id}">

          <!-- #fields solo resuelve dentro del elemento que declara th:object. -->
          <div class="col-12 alert alert-warning mb-0" th:if="${#fields.hasAnyErrors()}" role="alert">
            <ul class="mb-0 ps-3">
              <li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li>
            </ul>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" for="estacionOrigen">Estación origen</label>
            <select class="form-select" id="estacionOrigen" th:field="*{estacionOrigen}" required>
              <option value="">Selecciona una estación</option>
              <option th:each="est : ${estaciones}" th:value="${est.id}" th:text="${est.nombre}"></option>
            </select>
          </div>

          <div class="col-12 col-md-6">
            <label class="form-label fw-semibold" for="estacionDestino">Estación destino</label>
            <select class="form-select" id="estacionDestino" th:field="*{estacionDestino}" required>
              <option value="">Selecciona una estación</option>
              <option th:each="est : ${estaciones}" th:value="${est.id}" th:text="${est.nombre}"></option>
            </select>
          </div>

          <div class="col-6 col-md-3">
            <label class="form-label fw-semibold" for="horarioSalida">Salida</label>
            <input type="time" class="form-control" id="horarioSalida" th:field="*{horarioSalida}" required>
          </div>

          <div class="col-6 col-md-3">
            <label class="form-label fw-semibold" for="horarioLlegada">Llegada</label>
            <input type="time" class="form-control" id="horarioLlegada" th:field="*{horarioLlegada}" required>
          </div>

          <div class="col-6 col-md-3">
            <label class="form-label fw-semibold" for="tiempoTransitoMin">Tránsito (min)</label>
            <input type="number" min="1" class="form-control" id="tiempoTransitoMin" th:field="*{tiempoTransitoMin}"
              required>
          </div>

          <div class="col-6 col-md-3">
            <label class="form-label fw-semibold" for="tarifa">Tarifa (S/)</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="tarifa" th:field="*{tarifa}" required>
          </div>

          <div class="col-12 d-flex justify-content-end gap-2">
            <a th:href="@{/servicios-tren}" class="btn btn-mtc-outline">Limpiar</a>
            <button type="submit" class="btn btn-mtc">
              <i class="bi bi-check2 me-2"></i>Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="card section-card">
      <div class="card-body p-4">
        <h2 class="h6 section-title mb-3"><i class="bi bi-clock-history"></i> Servicios registrados</h2>

        <div class="table-responsive">
          <table class="table table-mtc table-sm mb-0">
            <thead>
              <tr>
                <th>Origen</th>
                <th>Destino</th>
                <th>Salida</th>
                <th>Llegada</th>
                <th>Tránsito</th>
                <th>Tarifa</th>
                <th class="text-end">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="serv : ${servicios}">
                <td>
                  <span class="route-cell">
                    <i class="bi bi-geo-alt-fill"></i>
                    <span th:text="${serv.estacionOrigen.nombre}">Origen</span>
                  </span>
                </td>
                <td>
                  <span class="route-cell">
                    <i class="bi bi-geo-alt-fill"></i>
                    <span th:text="${serv.estacionDestino.nombre}">Destino</span>
                  </span>
                </td>
                <td th:text="${serv.horarioSalida}">00:00</td>
                <td th:text="${serv.horarioLlegada}">00:00</td>
                <td th:text="${serv.tiempoTransitoMin} + ' min'">0 min</td>
                <td><span class="fare-pill" th:text="'S/ ' + ${serv.tarifa}">S/ 0</span></td>
                <td class="text-end">
                  <div class="d-flex justify-content-end gap-1">
                    <a class="btn btn-sm btn-mtc-outline" th:href="@{'/servicios-tren/' + ${serv.id} + '/editar'}"
                      title="Editar horario y tarifa">
                      <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{'/servicios-tren/' + ${serv.id} + '/eliminar'}" method="post"
                      onsubmit="return confirm('¿Está seguro de eliminar este servicio de tren? Esta acción no se puede deshacer.');"
                      class="d-inline">
                      <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar servicio">
                        <i class="bi bi-slash-circle"></i>
                      </button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(servicios)}">
                <td colspan="7" class="text-center page-sub py-4">
                  No hay servicios de tren registrados.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <div th:replace="~{layout/footer :: footer}"></div>
  <div th:replace="~{layout/base :: scripts}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
