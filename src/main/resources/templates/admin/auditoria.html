<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!--
  RF-16 / RNF-07: log de trazabilidad. Registra las operaciones administrativas
  (INSERT/UPDATE/DELETE) sobre zonas, horarios y precios, y las sincronizaciones
  automáticas con PeruRail y SENAMHI (SYNC). Restringido a ADMIN_MTC.
-->
<head th:replace="~{layout/base :: head('Auditoría')}"></head>

<body>
<div th:replace="~{layout/nav :: nav}"></div>

<main class="container py-4" style="max-width: 1100px;">

  <div class="mb-4">
    <h1 class="h4 fw-bold page-title mb-1">Log de auditoría</h1>
    <p class="page-sub mb-0">Historial de operaciones realizadas sobre el sistema.</p>
  </div>

  <form method="get" th:action="@{/auditoria}" class="card section-card mb-3">
    <div class="card-body p-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-8">
          <label class="form-label fw-semibold mb-1" for="tabla">Tabla afectada</label>
          <select class="form-select form-select-sm" id="tabla" name="tabla">
            <option value="">Todas las tablas</option>
            <option th:each="t : ${ {'zona_turistica','servicio_tren','estacion','prevision_clima',
                                     'informe_planificacion'} }"
                    th:value="${t}" th:text="${t}" th:selected="${t == tablaFiltrada}"></option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <button type="submit" class="btn btn-mtc btn-sm w-100">
            <i class="bi bi-funnel me-1"></i>Filtrar
          </button>
        </div>
      </div>
    </div>
  </form>

  <div class="card section-card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-mtc table-sm mb-0">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Usuario</th>
              <th>Operación</th>
              <th>Tabla</th>
              <th>Valor anterior</th>
              <th>Valor nuevo</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="log : ${registros}">
              <td class="text-nowrap"
                  th:text="${#temporals.format(log.fecha, 'dd/MM/yyyy HH:mm')}">fecha</td>
              <td>
                <span class="est-name">
                  <i class="bi bi-person-circle"></i>
                  <span th:text="${log.usuario}">usuario</span>
                </span>
              </td>
              <td>
                <span class="badge"
                      th:classappend="${log.operacion == 'INSERT'} ? 'badge-activa'
                                       : (${log.operacion == 'DELETE'} ? 'badge-inactiva' : 'badge-pendiente')"
                      th:text="${log.operacion}">UPDATE</span>
              </td>
              <td><span class="code-pill" th:text="${log.tablaAfectada}">tabla</span></td>
              <td class="small text-break" th:text="${log.valorAnterior} ?: '—'"
                  th:title="${log.valorAnterior}">—</td>
              <td class="small text-break" th:text="${log.valorNuevo} ?: '—'"
                  th:title="${log.valorNuevo}">—</td>
            </tr>
            <tr th:if="${#lists.isEmpty(registros)}">
              <td colspan="6" class="text-center page-sub py-4">
                No hay operaciones registradas para el filtro seleccionado.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</main>

<div th:replace="~{layout/footer :: footer}"></div>
<div th:replace="~{layout/base :: scripts}"></div>
</body>

</html>
