spring.application.name=asesor-turistico-mtc

# ------------------------------------------------------------------
# Perfil de desarrollo local: conecta al contenedor postgres-mtc
# publicado en el puerto no estandar 5440 (ver docker-compose.yml).
# ------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5440/bd_asesor_turistico
spring.datasource.username=admin_mtc
spring.datasource.password=mtc2026
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema (01_esquema.sql) y los datos (02_datos.sql) los crea el
# entrypoint de Docker; la app solo valida que coincidan con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Preserva el prefijo/casing exacto de las columnas (EstIdEstacion, ZonNombre, ...)
# definido en el diccionario de datos (seccion 6.3/6.4 del documento).
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# RNF-01: las consultas de zonas, rutas e informes resuelven sus asociaciones
# dentro de la capa de servicio (fetch joins), no de forma perezosa en la
# vista; desactivar open-in-view evita consultas sueltas durante el render.
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# ------------------------------------------------------------------
# Arquitectura fisica (seccion 5.2): la aplicacion se publica en el
# puerto no estandar 8082, para no chocar con otros servicios del
# entorno de desarrollo.
# ------------------------------------------------------------------
server.port=8082

# ------------------------------------------------------------------
# Integraciones externas (mocks desde Sprint 0; reemplazar por las URLs
# reales de PeruRail/SENAMHI cuando el MTC consiga los accesos).
#
# El mock del SENAMHI (MockSenamhiController) se publica dentro de la propia
# aplicacion, en /mock/senamhi: por eso la URL base apunta al mismo puerto
# 8082. La llamada sigue siendo HTTP real, asi que la Capa de Integracion se
# ejercita completa. Para usar el servicio verdadero basta con apagar el mock
# y cambiar la URL; ni SenamhiClient ni la tarea programada cambian.
# ------------------------------------------------------------------
integracion.perurail.base-url=http://localhost:9081/mock/perurail
integracion.senamhi.base-url=http://localhost:8082/mock/senamhi
integracion.senamhi.mock.habilitado=true

# RNF-03: sincronizacion diaria de frecuencias/tarifas y del pronostico.
integracion.perurail.cron=0 0 3 * * *
integracion.senamhi.cron=0 0 4 * * *

# Dias de pronostico que se piden y se guardan en cada sincronizacion, para
# que el turista pueda planificar una visita de los proximos dias (CU-03).
integracion.senamhi.dias-pronostico=7

# La tarea del clima corre de madrugada: si la aplicacion arranca mas tarde y
# aun no hay pronostico de hoy, se sincroniza al iniciar.
integracion.senamhi.sincronizar-al-iniciar=true

# ------------------------------------------------------------------
# Mapa base (RNF-02): los mapas piden las teselas CartoDB Voyager, que
# CARTO sirve gratis (5 millones al mes) pero solo con clave; sin ella las
# estampa con "API KEY REQUIRED". La clave se crea en
# https://carto.com/basemaps/apikey y se pasa por la variable de entorno
# CARTO_API_KEY, nunca escrita aqui. Vacia, los mapas usan OpenStreetMap.
# ------------------------------------------------------------------
mapa.carto.api-key=${CARTO_API_KEY:}

# RNF-01 / RNF-08: pool de conexiones dimensionado para la concurrencia de
# turistas generando informes a la vez. Con un pool menor que las peticiones
# simultaneas, las que no consiguen conexion fallan por timeout en vez de
# responder, aunque el control de aforo sea correcto.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
